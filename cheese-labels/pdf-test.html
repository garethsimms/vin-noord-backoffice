<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vin Noord PDF-test</title><style>body{font:18px system-ui;margin:24px}button,input{font:inherit;padding:12px;margin:8px 0}button{display:block}iframe{width:100%;height:180px;border:1px solid #aaa}#status{white-space:pre-wrap}</style><h2>Vin Noord – PDF-test</h2><label>Gewicht in gram <input id="g" type="number" value="150" min="1"></label><button id="make">Genereer PDF</button><p id="status"></p><iframe id="preview" title="PDF voorbeeld" hidden></iframe><button id="print" disabled>Print PDF</button><a id="save" hidden download="label-test.pdf">Open / bewaar test-PDF</a><script>
let url;const $=id=>document.getElementById(id);$('make').onclick=()=>{try{const g=Number($('g').value);if(!Number.isFinite(g)||g<=0)throw Error('Ongeldig gewicht');const price=(g*26.5/1000).toFixed(2);const stream=`BT /F1 10 Tf 7 39 Td (VIN NOORD - TEST) Tj 0 -14 Td (Comte - ${g} g) Tj 0 -14 Td (EUR ${price}) Tj ET\n`;const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 175.7480315 56.6929134] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}endstream`];let pdf='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;const blob=new Blob([pdf],{type:'application/pdf'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('status').textContent='PDF gegenereerd: '+blob.size+' bytes. Formaat: 62 × 20 mm.';$('preview').hidden=false;$('preview').src=url;$('save').href=url;$('save').hidden=false;$('print').disabled=false;}catch(e){$('status').textContent='Fout: '+e.message}};$('print').onclick=()=>{try{$('preview').contentWindow.focus();$('preview').contentWindow.print();}catch(e){$('status').textContent+='\nPrintfout: '+e.message}};</script></html>
